<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HealthCheck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="main-wrapper">
    <div class="form-box">
        <div class="header">
            <div class="logo-icon"><i class="fa-solid fa-heart-pulse"></i></div>
            <h1>HealthCheck</h1>
            <p class="tagline">Cek kondisi kesehatan kamu dalam hitungan detik</p>
        </div>

        <form id="healthForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input id="name" required>
                <label>Nama</label>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="number" id="age" required>
                    <label>Umur</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-venus-mars"></i>
                    <select id="gender" required>
                        <option value="">Pilih</option>
                        <option value="male">Laki-laki</option>
                        <option value="female">Perempuan</option>
                    </select>
                    <label>Jenis Kelamin</label>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <input type="number" id="weight" required>
                    <label>Berat (kg)</label>
                </div>
                <div class="input-group">
                    <input type="number" id="height" required>
                    <label>Tinggi (cm)</label>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <input id="blood_pressure" placeholder="120/80" required>
                    <label>Tekanan Darah</label>
                </div>
                <div class="input-group">
                    <input type="number" id="blood_sugar" required>
                    <label>Gula Darah</label>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <input type="number" id="meals" required>
                    <label>Makan (x/hari)</label>
                </div>
                <div class="input-group">
                    <input type="number" step="0.1" id="water" required>
                    <label>Air (L/hari)</label>
                </div>
            </div>

            <button class="btn-primary">Cek Sekarang</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
