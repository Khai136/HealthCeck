<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCheck - Cek Kesehatan Kamu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="main-wrapper">
    <div class="form-box">
        
        <!-- Header -->
        <div class="header">
            <div class="logo-icon">
                <i class="fa-solid fa-heartbeat"></i>
            </div>
            <h1>HealthCheck</h1>
            <p class="tagline">Cek kondisi kesehatan kamu dalam hitungan detik</p>
        </div>

        <!-- Form -->
        <form id="healthForm">
            
            <!-- Row 1: Nama (Full Width) -->
            <div class="input-group">
                <i class="fa-solid fa-user icon-name"></i>
                <input 
                    type="text" 
                    name="name" 
                    id="name"
                    placeholder="Masukkan nama lengkap"
                    maxlength="50"
                    required
                >
                <label>Nama Lengkap</label>
                <div class="error-msg" id="name-error"></div>
            </div>

            <!-- Row 2: Umur & Jenis Kelamin -->
            <div class="input-row">
                <div class="input-group">
                    <i class="fa-solid fa-calendar icon-age"></i>
                    <input 
                        type="number" 
                        name="age" 
                        id="age"
                        placeholder="25"
                        min="1"
                        max="150"
                        required
                    >
                    <label>Umur (tahun)</label>
                    <div class="error-msg" id="age-error"></div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-venus-mars icon-gender"></i>
                    <select name="gender" id="gender" required>
                        <option value="">Pilih</option>
                        <option value="male">Laki-laki</option>
                        <option value="female">Perempuan</option>
                    </select>
                    <label>Jenis Kelamin</label>
                    <div class="error-msg" id="gender-error"></div>
                </div>
            </div>

            <!-- Row 3: Berat & Tinggi -->
            <div class="input-row">
                <div class="input-group">
                    <i class="fa-solid fa-weight-scale icon-weight"></i>
                    <input 
                        type="number" 
                        step="0.1" 
                        name="weight" 
                        id="weight"
                        placeholder="65.5"
                        min="20"
                        max="300"
                        required
                    >
                    <label>Berat (kg)</label>
                    <div class="error-msg" id="weight-error"></div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-ruler-vertical icon-height"></i>
                    <input 
                        type="number" 
                        step="0.1" 
                        name="height" 
                        id="height"
                        placeholder="170"
                        min="100"
                        max="250"
                        required
                    >
                    <label>Tinggi (cm)</label>
                    <div class="error-msg" id="height-error"></div>
                </div>
            </div>

            <!-- Row 4: Tekanan Darah & Gula Darah -->
            <div class="input-row">
                <div class="input-group">
                    <i class="fa-solid fa-heart-pulse icon-bp"></i>
                    <input 
                        type="text" 
                        name="blood_pressure" 
                        id="blood_pressure"
                        placeholder="120/80"
                        pattern="\d{2,3}/\d{2,3}"
                        required
                    >
                    <label>Tekanan Darah</label>
                    <div class="error-msg" id="blood_pressure-error"></div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-droplet-slash icon-sugar"></i>
                    <input 
                        type="number" 
                        step="0.1" 
                        name="blood_sugar" 
                        id="blood_sugar"
                        placeholder="100"
                        min="50"
                        max="500"
                        required
                    >
                    <label>Gula Darah (mg/dL)</label>
                    <div class="error-msg" id="blood_sugar-error"></div>
                </div>
            </div>

            <!-- Row 5: Makan & Air -->
            <div class="input-row">
                <div class="input-group">
                    <i class="fa-solid fa-utensils icon-meals"></i>
                    <input 
                        type="number" 
                        name="meals" 
                        id="meals"
                        placeholder="3"
                        min="0"
                        max="10"
                        required
                    >
                    <label>Makan (x/hari)</label>
                    <div class="error-msg" id="meals-error"></div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-glass-water icon-water"></i>
                    <input 
                        type="number" 
                        step="0.1" 
                        name="water" 
                        id="water"
                        placeholder="2.5"
                        min="0"
                        max="10"
                        required
                    >
                    <label>Air Minum (L/hari)</label>
                    <div class="error-msg" id="water-error"></div>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 
                    Cek Sekarang
                </span>
                <span class="btn-loader" style="display: none;">
                    <i class="fa-solid fa-spinner fa-spin"></i> 
                    Menganalisis...
                </span>
            </button>
        </form>

        <!-- Info Footer -->
        <div class="info-footer">
            <i class="fa-solid fa-shield-heart"></i>
            <span>Data kamu aman dan tidak disimpan di server</span>
        </div>

    </div>
</div>

<!-- JavaScript -->
<script src="app.js"></script>

</body>
</html>
